name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_VER) is lower than 17."
            exit 1
          fi
          echo "Java version verification passed."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore official debug keystore
        run: |
          cat << 'EOF' | base64 -d > ./debug.keystore

EOF
          echo "Verifying debug.keystore fingerprint:"
          keytool -list -v -keystore ./debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1|SHA256"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_TARGET="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_TARGET" ]; then
            echo "Error: Target APK $APK_TARGET does not exist!"
            echo "Discovered APK files in app/build/outputs/apk:"
            find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$APK_TARGET" ]; then
            echo "Error: APK file $APK_TARGET is empty!"
            exit 1
          fi
          case "$APK_TARGET" in
            *.apk) ;;
            *) echo "Error: $APK_TARGET does not have .apk extension!"; exit 1 ;;
          esac
          echo "APK verification successful: $APK_TARGET (size: $(stat -c%s "$APK_TARGET" 2>/dev/null || stat -f%z "$APK_TARGET") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_DIR/app-debug.apk"
          echo "asset_path=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: $TMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset missing or empty at $ASSET_PATH"
            exit 1
          fi

          FILENAME=$(basename "$ASSET_PATH")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "Error: Asset filename is not app-debug.apk"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ### Debug APK Build Information
          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Target**: Testing and development use
          - **Note**: This APK is signed with a temporary debug keystore and is not a Play Store production release.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Filename: app-debug.apk"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"

            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Note**: The GitHub Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "The APK build succeeded and the backup artifact 'app-debug-apk' remains available under GitHub Actions artifacts."
            echo "## BUILD RESULT" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Release publishing could not be completed, but the Actions artifact \`app-debug-apk\` is available." >> "$GITHUB_STEP_SUMMARY"
          fi
